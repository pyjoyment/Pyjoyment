name: Docker Smoke Test

# Builds and runs the images of "generate dockerfile" for an application, a
# Lite script with pyproject.toml and a Lite script with the inline metadata
# of PEP 723, with the wheel of the checkout, and checks that they serve the
# generated pages and stop gracefully, and runs a Lite script as an event
# function in the image of AWS Lambda for Python, also streaming its responses
# with the runtime client of Pyjoyment, and in an image of "generate dockerfile
# --target lambda" and in the ZIP files of "generate lambda-zip" under the
# emulator of the Runtime API, a Lite script that speaks FastCGI to Caddy in
# front of it, and a Lite script in the manifests of "generate kubernetes" on a
# cluster of kind. The weekly run catches a change of the images of Python, uv,
# AWS Lambda and Caddy, and of the builds of Python that uv installs.
on:
  push:
    branches:
      - main
    paths:
      - tt/docker-smoke/**
      - .github/workflows/docker-smoke.yaml
      - .github/actions/test-report/**
      - .github/scripts/test-report.py
      - examples/lambda_stream/function/wrapper.py
      - Pyjo/**
      - Pyjoyment/**
      - mise.lock
      - mise.toml
      - pyproject.toml
  pull_request:
    branches:
      - "**"
    paths:
      - tt/docker-smoke/**
      - .github/workflows/docker-smoke.yaml
      - .github/actions/test-report/**
      - .github/scripts/test-report.py
      - examples/lambda_stream/function/wrapper.py
      - Pyjo/**
      - Pyjoyment/**
      - mise.lock
      - mise.toml
      - pyproject.toml
  schedule:
    - cron: 37 5 * * 1
  workflow_dispatch: {}

permissions:
  contents: read

env:
  # kind and the Kubernetes of its node, for the variant kubernetes
  kind_version: 0.33.0 # datasource=github-releases depName=kubernetes-sigs/kind
  kubernetes_version: 1.37.0 # datasource=docker depName=kindest/node

jobs:
  smoke:
    name: smoke (${{ matrix.variant }})

    strategy:
      fail-fast: false
      matrix:
        variant:
          - app
          - lite
          - lite-pep723
          - lambda
          - lambda-stream
          - lambda-image
          - lambda-zip
          - fastcgi
          - kubernetes

    runs-on: ubuntu-26.04-arm
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up mise
        uses: jdx/mise-action@v5
        with:
          version: 2026.11.7 # datasource=github-releases depName=jdx/mise

      - name: Install kind
        if: matrix.variant == 'kubernetes'
        uses: helm/kind-action@v1
        with:
          install_only: true
          version: v${{ env.kind_version }}
          kubectl_version: v${{ env.kubernetes_version }}

      - name: Run smoke test
        env:
          VARIANT: ${{ matrix.variant }}
          KIND_NODE_IMAGE: kindest/node:v${{ env.kubernetes_version }}
          # The emulator of the Runtime API of the variant lambda-image, which its image does not have
          RIE_VERSION: 1.38 # datasource=github-releases depName=aws/aws-lambda-runtime-interface-emulator versioning=loose
        run: tt/docker-smoke/smoke.sh "${VARIANT}" --color --formatter junit=smoke-report.xml --formatter "markdown=$GITHUB_STEP_SUMMARY"

      # The JUnit XML of the harness, as the annotations of the failed tests
      - name: Publish the report of the tests
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: smoke-report.xml
          annotate_only: true
          job_summary: false
          include_skipped: false

      # The JUnit XML for the summary of the summaries of all the variants,
      # which the job Docker Smoke Test makes
      - name: Upload the report of the tests
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: junit-smoke (${{ matrix.variant }})
          path: smoke-report.xml
          if-no-files-found: ignore
          retention-days: 7

  # The one check of the matrix, whatever variants it has: it fails when a
  # variant failed or was cancelled. The workflow runs only for the paths
  # above, so a ruleset that required it would wait for it forever in a pull
  # request that does not change them. Before that, it makes the summary of
  # the summaries of the variants, as the job Tests of the workflow Tests does.
  docker-smoke:
    name: Docker Smoke Test
    needs: smoke
    if: always()
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Report of the tests
        uses: ./.github/actions/test-report
        with:
          title: Docker Smoke Test

      # Also when a step of the report failed, or the run was cancelled
      - name: Check the result of the matrix
        if: always()
        shell: bash
        env:
          RESULT: ${{ needs.smoke.result }}
        run: test "$RESULT" = success
