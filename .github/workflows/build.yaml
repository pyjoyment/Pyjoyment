name: Build

# Checks that uv.lock matches pyproject.toml, builds the sdist and the wheel,
# checks that the wheel has the files of the package that hatchling takes from
# the patterns of .gitignore, and installs it and runs pyjo version and
# examples/ua/loopback.py, a request to a server of its own, outside the checkout.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "**"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    name: build

    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up mise
        uses: jdx/mise-action@v5
        with:
          version: 2026.10.4 # datasource=github-releases depName=jdx/mise

      # uv.lock has to match pyproject.toml.
      - name: Check uv.lock
        run: uv lock --check

      - name: Build sdist and wheel
        run: uv build

      # Package data is the easiest part of a package to lose silently.
      - name: Check wheel contents
        run: |-
          python -m zipfile -l dist/*.whl | tee wheel.txt
          grep -q 'Pyjo/IOLoop/certs/server.crt' wheel.txt
          grep -q 'Pyjo/IOLoop/certs/server.key' wheel.txt
          grep -q 'Pyjoyment/__init__.py' wheel.txt
          grep -q 'Pyjoyment/resources/public/favicon.ico' wheel.txt
          grep -q 'Pyjoyment/resources/public/pyjo/logo.png' wheel.txt
          grep -q 'Pyjoyment/resources/public/pyjo/bootstrap/bootstrap.css' wheel.txt
          grep -q 'Pyjoyment/resources/templates/pyjo/debug.html.ep' wheel.txt
          grep -q 'Pyjo/py.typed' wheel.txt

      # The wheel in an environment of its own, outside the checkout, so that
      # nothing comes from it.
      - name: Install and run the wheel
        shell: bash
        run: |-
          uv venv --python "$(command -v python)" "$RUNNER_TEMP/venv"
          uv pip install --python "$RUNNER_TEMP/venv/bin/python" dist/*.whl
          cp examples/ua/loopback.py "$RUNNER_TEMP/"
          cd "$RUNNER_TEMP"
          venv/bin/pyjo version
          venv/bin/python loopback.py | tee loopback.txt
          grep -qx '200 Your Pyjo is working!' loopback.txt
